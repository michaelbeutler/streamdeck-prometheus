name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck-prometheus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: streamdeck-prometheus/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package plugin
        run: |
          cd cloud.iperka.streamdeck-prometheus.sdPlugin
          zip -r ../streamdeck-prometheus-${{ github.ref_name }}.streamDeckPlugin .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: streamdeck-prometheus/streamdeck-prometheus-${{ github.ref_name }}.streamDeckPlugin
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
